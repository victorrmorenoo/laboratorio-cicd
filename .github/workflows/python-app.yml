name: Pipeline CI-CD FastAPI

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/victorrmorenoo/laboratorio-cicd

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar codigo
        run: python -m compileall .

      - name: Configurar Docker
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar e enviar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  Deploy_Homologacao:
    needs: Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && vars.DEPLOY_HOMOLOGACAO == 'true'

    environment:
      name: homologacao

    steps:
      - name: Deploy em Homologacao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop api-homologacao || true
            docker rm api-homologacao || true
            docker run -d \
              --name api-homologacao \
              --restart always \
              -p 8080:8000 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

  Deploy_Producao:
    needs: Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PRODUCAO == 'true'

    environment:
      name: producao

    steps:
      - name: Deploy em Producao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop api-producao || true
            docker rm api-producao || true
            docker run -d \
              --name api-producao \
              --restart always \
              -p 80:8000 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}
